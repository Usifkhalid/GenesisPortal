<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="hd.name">IT Helpdesk</title>

    <meta name="theme-color" content="#f8f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1611" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png" />
    <link
      rel="preload"
      href="assets/fonts/plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages/admin.css" />
    <link rel="stylesheet" href="assets/css/pages/rooms.css" />
    <link rel="stylesheet" href="assets/css/pages/tickets.css" />
    <link rel="stylesheet" href="assets/css/pages/notifications.css" />
    <link rel="stylesheet" href="assets/css/pages/helpdesk.css" />
  </head>

  <!-- The IT Helpdesk (D135): IT team members' own workspace, with no way into
       the portal. The server sends anyone else to no-access.html. -->
  <body>
    <a class="u-skip-link" href="#main" data-i18n="app.skipToContent">Skip to main content</a>

    <!-- data-booting hides the shell until helpdesk.js knows who is signed in. -->
    <div class="app app--helpdesk" data-booting>
      <!-- ========================================================== top bar === -->
      <header class="topbar hd-topbar">
        <div class="topbar__inner hd-topbar__inner">
          <a class="hd-brand" href="#queue">
            <span class="hd-brand__mark" aria-hidden="true">
              <svg aria-hidden="true" focusable="false"><use href="#i-tickets" /></svg>
            </span>
            <span class="hd-brand__text">
              <span class="hd-brand__name" data-i18n="hd.name">IT Helpdesk</span>
              <span class="hd-brand__group" data-i18n="app.group"></span>
            </span>
          </a>

          <nav class="hd-nav" data-i18n-attr="aria-label:hd.nav.label">
            <a class="hd-nav__link" href="#queue" data-nav="queue" data-i18n="hd.nav.queue"
              >Queue</a
            >
            <a
              class="hd-nav__link"
              href="#assigned"
              data-nav="assigned"
              data-i18n="hd.nav.assigned"
              >My assigned tickets</a
            >
            <a
              class="hd-nav__link"
              href="#reports"
              data-nav="reports"
              data-i18n="hd.nav.reports"
              >Reports</a
            >
            <a
              class="hd-nav__link"
              href="#settings"
              data-nav="settings"
              data-i18n="hd.nav.settings"
              hidden
              >IT settings</a
            >
          </nav>

          <div class="topbar__actions">
            <div class="menu-wrap">
              <button
                type="button"
                class="btn btn--ghost btn--icon"
                id="notifBtn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="notifMenu"
              >
                <svg class="btn__icon" aria-hidden="true" focusable="false">
                  <use href="#i-notifications" />
                </svg>
                <span class="btn__count" id="notifCount" hidden></span>
              </button>
              <div class="menu menu--notices" id="notifMenu" hidden>
                <div id="notifList" aria-live="polite"></div>
                <hr class="menu__divider" />
                <a class="menu__item" href="#notifications" data-i18n="action.viewAll"
                  >View all</a
                >
                <a
                  class="menu__item"
                  href="#notifications/preferences"
                  data-i18n="notification.settings"
                  >Notification settings</a
                >
                <button
                  type="button"
                  class="menu__item"
                  id="notifMarkAll"
                  data-i18n="notification.markAll"
                  hidden
                >
                  Mark all as read
                </button>
              </div>
            </div>

            <div class="menu-wrap">
              <button
                type="button"
                class="btn btn--ghost topbar__user-btn"
                id="userMenuBtn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="userMenu"
                data-i18n-attr="aria-label:nav.account"
              >
                <span class="avatar avatar--sm" id="userAvatar" aria-hidden="true"></span>
                <span class="topbar__user-name" id="userMenuName"></span>
                <svg class="btn__icon" aria-hidden="true" focusable="false">
                  <use href="#i-chevronDown" />
                </svg>
              </button>
              <div class="menu" id="userMenu" hidden>
                <div class="menu__header">
                  <p class="menu__name" id="menuUserName"></p>
                  <p class="menu__meta" id="menuUserRole"></p>
                </div>
                <hr class="menu__divider" />
                <a class="menu__item" href="#tickets/new">
                  <svg aria-hidden="true" focusable="false"><use href="#i-plus" /></svg>
                  <span data-i18n="hd.newForMe">New ticket for me</span>
                </a>
                <a class="menu__item" href="#tickets">
                  <svg aria-hidden="true" focusable="false"><use href="#i-user" /></svg>
                  <span data-i18n="hd.myRequests">My own tickets</span>
                </a>
                <hr class="menu__divider" />
                <button type="button" class="menu__item" data-lang="en">
                  <span data-i18n="lang.en">English</span>
                </button>
                <button type="button" class="menu__item" data-lang="ar">
                  <span data-i18n="lang.ar">العربية</span>
                </button>
                <hr class="menu__divider" />
                <button type="button" class="menu__item" id="signOutBtn">
                  <svg aria-hidden="true" focusable="false"><use href="#i-signOut" /></svg>
                  <span data-i18n="nav.signOut">Sign out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- ====================================================== main area === -->
      <main class="main" id="main" tabindex="-1">
        <!-- router.js renders the page the address names here (pages/helpdesk/). -->
        <div class="page" id="page"></div>
      </main>

      <!-- ================================================ bottom nav (phone) === -->
      <nav class="bottomnav hd-bottomnav" data-i18n-attr="aria-label:hd.nav.label">
        <a class="bottomnav__link" href="#queue" data-nav="queue">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-tickets" />
          </svg>
          <span class="bottomnav__label" data-i18n="hd.nav.queue">Queue</span>
        </a>
        <a class="bottomnav__link" href="#assigned" data-nav="assigned">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-user" />
          </svg>
          <span class="bottomnav__label" data-i18n="hd.nav.assignedShort">Mine</span>
        </a>
        <a class="bottomnav__link" href="#reports" data-nav="reports">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-auditLog" />
          </svg>
          <span class="bottomnav__label" data-i18n="hd.nav.reports">Reports</span>
        </a>
        <a class="bottomnav__link" href="#settings" data-nav="settings" hidden>
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-settings" />
          </svg>
          <span class="bottomnav__label" data-i18n="hd.nav.settingsShort">Settings</span>
        </a>
      </nav>
    </div>

    <script type="module" src="assets/js/helpdesk.js"></script>
  </body>
</html>
