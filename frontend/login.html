<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="login.pageTitle">Sign in · MG Holding Portal</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f8f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1611" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="assets/fonts/plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages/login.css" />
  </head>

  <body class="login">
    <a class="u-skip-link" href="#main" data-i18n="app.skipToContent">Skip to main content</a>

    <header class="login__bar">
      <p class="login__brand" data-i18n="app.name">MG Holding Portal</p>

      <div class="segmented" role="group" data-i18n-attr="aria-label:lang.label">
        <button
          type="button"
          class="segmented__option"
          data-lang="en"
          lang="en"
          aria-pressed="true"
          data-i18n="lang.en"
        >
          English
        </button>
        <button
          type="button"
          class="segmented__option"
          data-lang="ar"
          lang="ar"
          aria-pressed="false"
          data-i18n="lang.ar"
        >
          العربية
        </button>
      </div>
    </header>

    <main class="page login__main" id="main">
      <div class="login__intro">
        <h1 class="login__title" data-i18n="login.title">Sign in</h1>
        <p class="login__lead" id="loginLead"></p>
      </div>

      <!-- Why the last attempt did not work. Filled by pages/login.js. -->
      <div id="loginNotice" hidden></div>

      <!-- The user picker (mock) or the Microsoft button (Entra). -->
      <div class="login__body" id="loginBody"></div>

      <p class="u-visually-hidden" id="loginStatus" role="status"></p>
    </main>

    <script type="module" src="assets/js/pages/login.js"></script>
  </body>
</html>
