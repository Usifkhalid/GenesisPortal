<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MG Holding Portal</title>

    <link
      rel="preload"
      href="assets/fonts/plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
  </head>

  <body>
    <a class="u-skip-link" href="#main" data-i18n="app.skipToContent">Skip to main content</a>

    <div class="app">
      <!-- ==================================================== rail (desktop) === -->
      <nav class="rail" id="rail" data-i18n-attr="aria-label:nav.label">
        <div class="rail__top">
          <a class="rail__brand" href="#">
            <span
              class="rail__mark"
              id="railMark"
              aria-hidden="true"
              data-i18n="app.companyShort"
              >GEN</span
            >
            <span class="rail__company">
              <span class="rail__company-name" data-i18n="app.company"></span>
              <span class="rail__company-group" data-i18n="app.group"></span>
            </span>
          </a>
          <button
            type="button"
            class="btn btn--ghost btn--icon u-hide-sm rail__toggle"
            id="railToggle"
            aria-expanded="true"
            data-i18n-attr="aria-label:nav.collapseRail"
          >
            <svg class="btn__icon" aria-hidden="true" focusable="false">
              <use href="#i-chevronEnd" />
            </svg>
          </button>
        </div>

        <div class="rail__nav">
          <a class="nav-link" href="#home" data-nav="home" aria-current="page">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-home" />
            </svg>
            <span class="rail__label" data-i18n="nav.home">Home</span>
          </a>
          <a class="nav-link" href="#announcements" data-nav="announcements">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-announcements" />
            </svg>
            <span class="rail__label" data-i18n="nav.announcements">Announcements</span>
          </a>
          <a class="nav-link" href="#rooms" data-nav="rooms">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-rooms" />
            </svg>
            <span class="rail__label" data-i18n="nav.rooms">Rooms</span>
          </a>
          <a class="nav-link" href="#tickets" data-nav="tickets">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-tickets" />
            </svg>
            <span class="rail__label" data-i18n="nav.tickets">Tickets</span>
            <span class="nav-link__count" id="railTicketCount">4</span>
          </a>
          <a class="nav-link" href="#directory" data-nav="directory">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-directory" />
            </svg>
            <span class="rail__label" data-i18n="nav.directory">Directory</span>
          </a>
        </div>

        <div class="rail__nav rail__section" id="railAdminSection" hidden>
          <a class="nav-link" href="#admin" data-nav="admin">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-admin" />
            </svg>
            <span class="rail__label" data-i18n="nav.admin">Company admin</span>
          </a>
          <a class="nav-link" href="#audit-log" data-nav="auditLog">
            <svg class="nav-link__icon" aria-hidden="true" focusable="false">
              <use href="#i-auditLog" />
            </svg>
            <span class="rail__label" data-i18n="nav.auditLog">Audit log</span>
          </a>
        </div>
      </nav>

      <!-- ========================================================== top bar === -->
      <header class="topbar">
        <a class="topbar__brand" href="#">
          <span
            class="rail__mark"
            id="topbarMark"
            aria-hidden="true"
            data-i18n="app.companyShort"
            >GEN</span
          >
        </a>

        <div class="input-group topbar__search">
          <svg class="input-group__icon" aria-hidden="true" focusable="false">
            <use href="#i-search" />
          </svg>
          <input
            class="input"
            type="search"
            id="globalSearch"
            data-i18n-attr="placeholder:field.searchPlaceholder, aria-label:field.searchPlaceholder"
          />
        </div>

        <div class="topbar__actions topbar__spacer">
          <div class="menu-wrap">
            <button
              type="button"
              class="btn btn--ghost btn--icon"
              id="notifBtn"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="notifMenu"
            >
              <svg class="btn__icon" aria-hidden="true" focusable="false">
                <use href="#i-notifications" />
              </svg>
              <span class="btn__count" id="notifCount">2</span>
            </button>
            <div class="menu" id="notifMenu" hidden>
              <div class="menu__notice">
                <p class="menu__notice-title" data-i18n="notification.sample1Title"></p>
                <p class="menu__notice-time" data-i18n="notification.sample1Time"></p>
              </div>
              <div class="menu__notice">
                <p class="menu__notice-title" data-i18n="notification.sample2Title"></p>
                <p class="menu__notice-time" data-i18n="notification.sample2Time"></p>
              </div>
              <hr class="menu__divider" />
              <a class="menu__item" href="#notifications" data-i18n="action.viewAll"
                >View all</a
              >
            </div>
          </div>

          <div class="menu-wrap">
            <button
              type="button"
              class="btn btn--ghost topbar__user-btn"
              id="userMenuBtn"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="userMenu"
              data-i18n-attr="aria-label:nav.account"
            >
              <span class="avatar avatar--sm" id="userAvatar" aria-hidden="true">YE</span>
              <span class="u-hide-sm" id="userMenuName"></span>
              <svg class="btn__icon" aria-hidden="true" focusable="false">
                <use href="#i-chevronDown" />
              </svg>
            </button>
            <div class="menu" id="userMenu" hidden>
              <div class="menu__header">
                <p class="menu__name" id="menuUserName"></p>
                <p class="menu__meta" id="menuUserCompany"></p>
              </div>
              <hr class="menu__divider" />
              <button type="button" class="menu__item" data-lang="en">
                <span data-i18n="lang.en">English</span>
              </button>
              <button type="button" class="menu__item" data-lang="ar">
                <span data-i18n="lang.ar">العربية</span>
              </button>
              <hr class="menu__divider" />
              <button type="button" class="menu__item" id="signOutBtn">
                <svg aria-hidden="true" focusable="false"><use href="#i-signOut" /></svg>
                <span data-i18n="nav.signOut">Sign out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ====================================================== main area === -->
      <main class="main" id="main">
        <div class="page">
          <div class="page__header">
            <div class="page__heading">
              <h1 data-i18n="home.title">Home</h1>
              <p class="page__lead" data-i18n="home.lead"></p>
            </div>
            <div class="page__actions">
              <button type="button" class="btn btn--primary">
                <svg class="btn__icon" aria-hidden="true" focusable="false">
                  <use href="#i-plus" />
                </svg>
                <span class="btn__label" data-i18n="action.newAnnouncement"
                  >New announcement</span
                >
              </button>
            </div>
          </div>

          <div class="empty">
            <svg class="empty__mark" aria-hidden="true" focusable="false">
              <use href="#i-blankLabel" />
            </svg>
            <p class="empty__title" data-i18n="home.welcomeTitle">You're all caught up</p>
            <p class="empty__text" data-i18n="home.welcomeText"></p>
          </div>
        </div>
      </main>

      <!-- ================================================ bottom nav (phone) === -->
      <nav class="bottomnav" data-i18n-attr="aria-label:nav.label">
        <a class="bottomnav__link" href="#home" data-nav="home" aria-current="page">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-home" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.home">Home</span>
        </a>
        <a class="bottomnav__link" href="#tickets" data-nav="tickets">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-tickets" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.tickets">Tickets</span>
        </a>
        <a class="bottomnav__link" href="#directory" data-nav="directory">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-directory" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.directory">Directory</span>
        </a>
        <a class="bottomnav__link" href="#announcements" data-nav="announcements">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-announcements" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.announcements">Announcements</span>
        </a>
        <button type="button" class="bottomnav__link" id="moreBtn" aria-haspopup="dialog">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-more" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.more">More</span>
        </button>
      </nav>
    </div>

    <!-- ======================================== "more" sheet (phone only) === -->
    <dialog class="dialog" id="moreSheet" aria-labelledby="moreSheetTitle">
      <div class="dialog__header">
        <h2 class="dialog__title" id="moreSheetTitle" data-i18n="nav.more">More</h2>
        <button
          type="button"
          class="btn btn--ghost btn--sm btn--icon dialog__close"
          data-dialog-close
          data-i18n-attr="aria-label:a11y.closeDialog"
        >
          <svg class="btn__icon" aria-hidden="true" focusable="false"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="dialog__body stack stack--tight">
        <a class="menu__item" href="#rooms" data-dialog-close>
          <svg aria-hidden="true" focusable="false"><use href="#i-rooms" /></svg>
          <span data-i18n="nav.rooms">Rooms</span>
        </a>
        <a class="menu__item" href="#admin" id="moreAdminLink" hidden data-dialog-close>
          <svg aria-hidden="true" focusable="false"><use href="#i-admin" /></svg>
          <span data-i18n="nav.admin">Company admin</span>
        </a>
        <a class="menu__item" href="#audit-log" id="moreAuditLogLink" hidden data-dialog-close>
          <svg aria-hidden="true" focusable="false"><use href="#i-auditLog" /></svg>
          <span data-i18n="nav.auditLog">Audit log</span>
        </a>
      </div>
    </dialog>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
