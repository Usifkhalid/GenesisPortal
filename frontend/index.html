<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="app.name">MG Holding Portal</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f8f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1611" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="assets/fonts/plex-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/pages/home.css" />
    <link rel="stylesheet" href="assets/css/pages/notifications.css" />
    <link rel="stylesheet" href="assets/css/pages/admin.css" />
    <link rel="stylesheet" href="assets/css/pages/announcements.css" />
    <link rel="stylesheet" href="assets/css/pages/directory.css" />
    <link rel="stylesheet" href="assets/css/pages/rooms.css" />
    <link rel="stylesheet" href="assets/css/pages/tickets.css" />
  </head>

  <body>
    <a class="u-skip-link" href="#main" data-i18n="app.skipToContent">Skip to main content</a>

    <!-- data-booting hides the shell until app.js knows who is signed in. -->
    <div class="app" data-booting>
      <!-- ==================================================== rail (desktop) === -->
      <nav class="rail" id="rail" data-i18n-attr="aria-label:nav.label">
        <div class="menu-wrap">
          <button
            type="button"
            class="switcher"
            id="companyBtn"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="companyMenu"
          >
            <span class="company-mark" data-company-mark aria-hidden="true"></span>
            <span class="switcher__text" data-rail-text>
              <span class="switcher__name" data-company-name></span>
              <span class="switcher__group" data-i18n="app.group"></span>
            </span>
            <svg class="switcher__chevron" aria-hidden="true" focusable="false">
              <use href="#i-chevronsUpDown" />
            </svg>
          </button>
          <div class="menu menu--start" id="companyMenu" data-company-menu hidden></div>
        </div>

        <div class="rail__scroll">
          <div class="rail__nav">
            <a class="nav-link" href="#home" data-nav="home">
              <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                <use href="#i-home" />
              </svg>
              <span class="rail__label" data-rail-text data-i18n="nav.home">Home</span>
            </a>
            <a class="nav-link" href="#announcements" data-nav="announcements">
              <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                <use href="#i-announcements" />
              </svg>
              <span class="rail__label" data-rail-text data-i18n="nav.announcements"
                >Announcements</span
              >
              <span
                class="nav-link__count"
                data-rail-text
                data-announcement-count
                hidden
              ></span>
            </a>
            <a class="nav-link" href="#rooms" data-nav="rooms">
              <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                <use href="#i-rooms" />
              </svg>
              <span class="rail__label" data-rail-text data-i18n="nav.rooms">Rooms</span>
            </a>
            <a class="nav-link" href="#tickets" data-nav="tickets">
              <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                <use href="#i-tickets" />
              </svg>
              <span class="rail__label" data-rail-text data-i18n="nav.tickets">Tickets</span>
              <span class="nav-link__count" data-rail-text data-ticket-count hidden></span>
            </a>
            <a class="nav-link" href="#directory" data-nav="directory">
              <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                <use href="#i-directory" />
              </svg>
              <span class="rail__label" data-rail-text data-i18n="nav.directory"
                >Directory</span
              >
            </a>
          </div>

          <div
            class="rail__group"
            id="railAdminSection"
            role="group"
            aria-labelledby="railAdminHeading"
            hidden
          >
            <p
              class="rail__heading"
              id="railAdminHeading"
              data-rail-text
              data-i18n="nav.administration"
            >
              Administration
            </p>
            <div class="rail__nav">
              <a class="nav-link" href="#admin" data-nav="admin">
                <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                  <use href="#i-admin" />
                </svg>
                <span class="rail__label" data-rail-text data-i18n="nav.admin"
                  >Company admin</span
                >
              </a>
              <a class="nav-link" href="#audit-log" data-nav="auditLog">
                <svg class="nav-link__icon" aria-hidden="true" focusable="false">
                  <use href="#i-auditLog" />
                </svg>
                <span class="rail__label" data-rail-text data-i18n="nav.auditLog"
                  >Audit log</span
                >
              </a>
            </div>
          </div>
        </div>

        <div class="rail__foot">
          <button
            type="button"
            class="btn btn--ghost rail__toggle"
            id="railToggle"
            aria-expanded="true"
          >
            <svg class="btn__icon" aria-hidden="true" focusable="false">
              <use href="#i-chevronEnd" />
            </svg>
            <span class="rail__label" data-rail-text data-i18n="nav.collapse">Collapse</span>
          </button>
        </div>
      </nav>

      <!-- ========================================================== top bar === -->
      <header class="topbar">
        <div class="topbar__inner">
          <div class="menu-wrap topbar__brand">
            <button
              type="button"
              class="switcher switcher--compact"
              id="companyBtnTop"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="companyMenuTop"
            >
              <span class="company-mark" data-company-mark aria-hidden="true"></span>
              <svg class="switcher__chevron" aria-hidden="true" focusable="false">
                <use href="#i-chevronsUpDown" />
              </svg>
            </button>
            <div class="menu menu--start" id="companyMenuTop" data-company-menu hidden></div>
          </div>

          <p class="topbar__title" id="topbarTitle" data-i18n="nav.home">Home</p>

          <div
            class="input-group topbar__search"
            role="search"
            data-i18n-attr="aria-label:search.landmark.top"
          >
            <svg class="input-group__icon" aria-hidden="true" focusable="false">
              <use href="#i-search" />
            </svg>
            <input
              class="input"
              type="search"
              id="globalSearch"
              aria-keyshortcuts="/"
              data-i18n-attr="aria-label:field.searchPlaceholder"
            />
            <kbd class="topbar__kbd" aria-hidden="true">/</kbd>
          </div>

          <div class="topbar__actions">
            <div class="menu-wrap">
              <button
                type="button"
                class="btn btn--ghost btn--icon"
                id="notifBtn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="notifMenu"
              >
                <svg class="btn__icon" aria-hidden="true" focusable="false">
                  <use href="#i-notifications" />
                </svg>
                <span class="btn__count" id="notifCount" hidden></span>
              </button>
              <div class="menu menu--notices" id="notifMenu" hidden>
                <div id="notifList" aria-live="polite"></div>
                <hr class="menu__divider" />
                <a class="menu__item" href="#notifications" data-i18n="action.viewAll"
                  >View all</a
                >
                <a
                  class="menu__item"
                  href="#notifications/preferences"
                  data-i18n="notification.settings"
                  >Notification settings</a
                >
                <button
                  type="button"
                  class="menu__item"
                  id="notifMarkAll"
                  data-i18n="notification.markAll"
                  hidden
                >
                  Mark all as read
                </button>
              </div>
            </div>

            <div class="menu-wrap">
              <button
                type="button"
                class="btn btn--ghost topbar__user-btn"
                id="userMenuBtn"
                aria-haspopup="true"
                aria-expanded="false"
                aria-controls="userMenu"
                data-i18n-attr="aria-label:nav.account"
              >
                <span class="avatar avatar--sm" id="userAvatar" aria-hidden="true"></span>
                <span class="topbar__user-name" id="userMenuName"></span>
                <svg class="btn__icon" aria-hidden="true" focusable="false">
                  <use href="#i-chevronDown" />
                </svg>
              </button>
              <div class="menu" id="userMenu" hidden>
                <div class="menu__header">
                  <p class="menu__name" id="menuUserName"></p>
                  <p class="menu__meta" id="menuUserCompany"></p>
                </div>
                <hr class="menu__divider" />
                <button type="button" class="menu__item" data-lang="en">
                  <span data-i18n="lang.en">English</span>
                </button>
                <button type="button" class="menu__item" data-lang="ar">
                  <span data-i18n="lang.ar">العربية</span>
                </button>
                <hr class="menu__divider" />
                <button type="button" class="menu__item" id="signOutBtn">
                  <svg aria-hidden="true" focusable="false"><use href="#i-signOut" /></svg>
                  <span data-i18n="nav.signOut">Sign out</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- ====================================================== main area === -->
      <main class="main" id="main" tabindex="-1">
        <!-- router.js renders the page the address names here. See assets/js/pages/. -->
        <!-- The portal's own state (offline, update ready). Filled by components/status-banner.js. -->
        <div class="status-banner" id="statusBanner" hidden></div>
        <div class="page" id="page"></div>
      </main>

      <!-- ================================================ bottom nav (phone) === -->
      <nav class="bottomnav" data-i18n-attr="aria-label:nav.label">
        <a class="bottomnav__link" href="#home" data-nav="home">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-home" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.home">Home</span>
        </a>
        <a class="bottomnav__link" href="#tickets" data-nav="tickets">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-tickets" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.tickets">Tickets</span>
        </a>
        <a class="bottomnav__link" href="#rooms" data-nav="rooms">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-rooms" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.roomsShort">Rooms</span>
        </a>
        <a class="bottomnav__link" href="#directory" data-nav="directory">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-directory" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.directory">Directory</span>
        </a>
        <button type="button" class="bottomnav__link" id="moreBtn" aria-haspopup="dialog">
          <svg class="bottomnav__icon" aria-hidden="true" focusable="false">
            <use href="#i-more" />
          </svg>
          <span class="bottomnav__label" data-i18n="nav.more">More</span>
        </button>
      </nav>
    </div>

    <!-- ======================================== "more" sheet (phone only) === -->
    <dialog class="dialog" id="moreSheet" aria-labelledby="moreSheetTitle">
      <div class="dialog__header">
        <h2 class="dialog__title" id="moreSheetTitle" data-i18n="nav.more">More</h2>
        <button
          type="button"
          class="btn btn--ghost btn--sm btn--icon dialog__close"
          data-dialog-close
          data-i18n-attr="aria-label:a11y.closeDialog"
        >
          <svg class="btn__icon" aria-hidden="true" focusable="false"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="dialog__body stack stack--tight">
        <a class="menu__item" href="#announcements" data-nav="announcements" data-dialog-close>
          <svg aria-hidden="true" focusable="false"><use href="#i-announcements" /></svg>
          <span data-i18n="nav.announcements">Announcements</span>
          <span class="nav-link__count" data-announcement-count hidden></span>
        </a>
        <div
          class="stack stack--tight"
          id="moreAdminSection"
          role="group"
          aria-labelledby="moreAdminHeading"
          hidden
        >
          <hr class="menu__divider" />
          <p
            class="u-microlabel menu__label"
            id="moreAdminHeading"
            data-i18n="nav.administration"
          >
            Administration
          </p>
          <a class="menu__item" href="#admin" data-nav="admin" data-dialog-close>
            <svg aria-hidden="true" focusable="false"><use href="#i-admin" /></svg>
            <span data-i18n="nav.admin">Company admin</span>
          </a>
          <a class="menu__item" href="#audit-log" data-nav="auditLog" data-dialog-close>
            <svg aria-hidden="true" focusable="false"><use href="#i-auditLog" /></svg>
            <span data-i18n="nav.auditLog">Audit log</span>
          </a>
        </div>
      </div>
    </dialog>

    <!-- The live region toasts are appended to. Announced without taking focus. -->
    <div
      class="toaster"
      id="toaster"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
